[package]
name = "pixivdwn"
version = "0.2.0-alpha1"
edition = "2024"
description = "Incremental pixiv crawler/downloader"
license = "MIT"
documentation = "https://circuitcoder.github.io/pixivdwn"
homepage = "https://github.com/CircuitCoder/pixivdwn"
repository = "https://github.com/CircuitCoder/pixivdwn"

[dependencies]
anyhow = "1.0.99"
async-stream = "0.3.6"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
digest-io = "0.1.0"
dotenvy = "0.15.7"
futures = "0.3.31"
hex = "0.4.3"
image = "0.25.8"
indicatif = "0.18.0"
rand = "0.10.1"
regex = "1.12.3"
scraper = "0.27.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-unbundled", "macros", "derive", "runtime-tokio", "chrono", "migrate"] }
tempfile = "3.22.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
wreq = { version = "6.0.0-rc.29", features = ["json", "stream", "query", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = "3.0.0-rc.3"
zip = "8.6.0"
bag-lib = { git = "https://github.com/CircuitCoder/bag", rev = "v0.3.3" }
bag-fs = { git = "https://github.com/CircuitCoder/bag", rev = "v0.3.3" }
axum = "0.8.9"
tower-http = { version = "0.6.8", features = ["cors", "compression-br"] }
mime_guess = "2.0.5"
alphanumeric-sort = "1.5.8"
urlencoding = "2.1.3"
serde_path_to_error = "0.1.20"
pest = "2.8.8"
pest_derive = "2.8.8"
